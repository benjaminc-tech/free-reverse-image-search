<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Marvel red plate, inked in black like every other surface in this UI -->
  <rect x="3.5" y="3.5" width="93" height="93" rx="24" fill="#EC1D24" stroke="#0d0f13" stroke-width="7"/>
  <!-- Handle: black under-stroke separates gold from red, which is only 3.15:1 -->
  <path d="M56 54 L79 77" stroke="#0d0f13" stroke-width="19" stroke-linecap="round"/>
  <path d="M57 55 L77 75" stroke="#F0B323" stroke-width="11" stroke-linecap="round"/>
  <!-- Solid white lens: holds its shape down to 16px where a ring would fill in -->
  <circle cx="42" cy="40" r="25" fill="#ffffff" stroke="#0d0f13" stroke-width="7"/>
</svg>
